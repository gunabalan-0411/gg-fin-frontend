name: Build TV app (APK)

# The Android TV app is a thin wrapper (tv-app/) around the website's /tv page, so it rarely changes. This builds it in the cloud:
# no Android Studio needed. Run it from the Actions tab ("Run workflow"), or it runs when tv-app/ changes on main.
# The finished file is attached to the release "tv-latest" (and to the run as an artifact): GGFinance-TV.apk

on:
  workflow_dispatch:
    inputs:
      tv_url:
        description: "Page the TV opens (leave empty for the default dev site)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "tv-app/**"
      - ".github/workflows/tv-apk.yml"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build the release APK
        working-directory: tv-app
        env:
          TV_URL: ${{ github.event.inputs.tv_url }}
        run: gradle --no-daemon assembleRelease -PtvUrl="$TV_URL"

      - name: Name the file
        run: cp tv-app/app/build/outputs/apk/release/app-release.apk GGFinance-TV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GGFinance-TV
          path: GGFinance-TV.apk
          retention-days: 30

      - name: Attach to the release "tv-latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view tv-latest >/dev/null 2>&1 || gh release create tv-latest --title "GG Finance TV (latest APK)" --notes "The Android TV app. Install: see tv-app/README.md" --target "$GITHUB_SHA"
          gh release upload tv-latest GGFinance-TV.apk --clobber
